# Optional: only for contributors without a local Postgres. `docker compose up -d db`
# then DATABASE_URL=postgresql://postgres:postgres@localhost:5432/residue
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: residue
    ports:
      - "5432:5432"
    volumes:
      - residue_pg:/var/lib/postgresql/data
volumes:
  residue_pg:
