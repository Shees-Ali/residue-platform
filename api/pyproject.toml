[project]
name = "residue-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "google-cloud-firestore>=2.19",  # events feed only
  "google-auth>=2.34",
  "google-genai>=0.3",
  "google-cloud-storage>=2.18",  # photo uploads; imported lazily, only when STORAGE_BUCKET is set
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["tdd: failing-by-design tests awaiting implementation (see memory/decisions.md)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/0001_initial_schema.py"]  # alembic autogenerate output

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
