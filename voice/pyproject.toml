[project]
name = "residue-voice"
version = "0.1.0"
requires-python = ">=3.12"
# NOTE: no Firestore or any database client here. CI enforces it (scripts/check_no_db_in_voice.py).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "google-adk>=1.0",
  "google-auth>=2.34",
  "httpx>=0.27",
  "twilio>=9.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
